name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Each step copies error / NuGet warning lines into GitHub annotations so they are
      # visible on the run summary page.
      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          dotnet tool restore 2>&1 | tee restore.log
          dotnet restore IntelligenceDB.slnx 2>&1 | tee -a restore.log || {
            grep -E "error|warn" restore.log | sort -u | head -50 | sed 's/^/::error::/'
            exit 1
          }

      # Warnings fail the build here (CI=true -> TreatWarningsAsErrors, see Directory.Build.props).
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build IntelligenceDB.slnx -c Release --no-restore 2>&1 | tee build.log || {
            grep -E ": (error|warning) " build.log | sort -u | head -80 | sed 's/^/::error::/'
            exit 1
          }

      - name: Check the EF model matches the committed migrations
        if: hashFiles('src/IntelligenceDB.Infrastructure/Repository/Migrations/*.cs') != ''
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/IntelligenceDB.Infrastructure
          --startup-project src/IntelligenceDB.Api
          --no-build --configuration Release

      # Integration tests start a SQL Server 2022 container with Testcontainers (Docker is available on the runner).
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test IntelligenceDB.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log || {
            grep -E "Failed |Error Message|Assert|Exception|error" test.log | sort -u | head -80 | sed 's/^/::error::/'
            exit 1
          }

  # Creates the first EF Core migration if it does not exist yet and commits it back to main
  # (the author's machine has no .NET SDK). Does nothing once the migration is committed.
  migration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Generate and commit the initial migration
        shell: bash
        run: |
          if ls src/IntelligenceDB.Infrastructure/Repository/Migrations/*_InitialCreate.cs >/dev/null 2>&1; then
            echo "Initial migration already committed."
            exit 0
          fi
          dotnet tool restore
          dotnet restore IntelligenceDB.slnx
          dotnet ef migrations add InitialCreate \
            --project src/IntelligenceDB.Infrastructure \
            --startup-project src/IntelligenceDB.Api \
            --output-dir Repository/Migrations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/IntelligenceDB.Infrastructure/Repository/Migrations
          git commit -m "Add initial repository migration (generated by CI)"
          git push

  # Starts the real API against a real SQL Server and runs scripts/e2e-smoke.sh.
  e2e:
    needs: backend
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "IntelliDb!Ci2026"
          MSSQL_AGENT_ENABLED: "true"
        ports:
          - 1433:1433
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Repository: "Server=localhost,1433;Database=IntelligenceDB_Repo;User Id=sa;Password=IntelliDb!Ci2026;Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: "ci-only-signing-key-0123456789-abcdefghijklmnopqrstuvwxyz"
      Bootstrap__AdminEmail: "admin@e2e.local"
      Bootstrap__AdminPassword: "Admin!E2e2026pass"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Ensure a migration exists (temporary for this run if not committed yet)
        shell: bash
        run: |
          dotnet tool restore
          dotnet restore IntelligenceDB.slnx
          if ! ls src/IntelligenceDB.Infrastructure/Repository/Migrations/*_InitialCreate.cs >/dev/null 2>&1; then
            dotnet ef migrations add InitialCreate --project src/IntelligenceDB.Infrastructure \
              --startup-project src/IntelligenceDB.Api --output-dir Repository/Migrations
          fi
      - name: Build API
        run: dotnet build src/IntelligenceDB.Api -c Release
      - name: Start API
        shell: bash
        run: |
          nohup dotnet run --project src/IntelligenceDB.Api -c Release --no-build --no-launch-profile \
            --urls http://localhost:5080 > api.log 2>&1 &
      - name: End-to-end smoke test
        shell: bash
        env:
          ADMIN_EMAIL: "admin@e2e.local"
          ADMIN_PASSWORD: "Admin!E2e2026pass"
          TARGET_HOST: "localhost"
          TARGET_PASSWORD: "IntelliDb!Ci2026"
        run: |
          bash scripts/e2e-smoke.sh || {
            grep -E "fail|error|Exception" -i api.log | grep -v "Microsoft.Hosting" | sort -u | head -40 | sed 's/^/::error::API: /'
            exit 1
          }
      - name: API log
        if: always()
        run: tail -100 api.log || true

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IntelligenceDB.Web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/IntelligenceDB.Web/package-lock.json
      - run: npm ci
      - run: npm run build
