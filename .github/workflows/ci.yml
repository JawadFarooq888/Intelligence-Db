name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # Each step copies error / NuGet warning lines into GitHub annotations so they are
      # visible on the run summary page.
      - name: Restore
        shell: bash
        run: |
          set -o pipefail
          dotnet tool restore 2>&1 | tee restore.log
          dotnet restore IntelligenceDB.slnx 2>&1 | tee -a restore.log || {
            grep -E "error|warn" restore.log | sort -u | head -50 | sed 's/^/::error::/'
            exit 1
          }

      # Warnings fail the build here (CI=true -> TreatWarningsAsErrors, see Directory.Build.props).
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build IntelligenceDB.slnx -c Release --no-restore 2>&1 | tee build.log || {
            grep -E ": (error|warning) " build.log | sort -u | head -80 | sed 's/^/::error::/'
            exit 1
          }

      # Integration tests start a SQL Server 2022 container with Testcontainers (Docker is available on the runner).
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          dotnet test IntelligenceDB.slnx -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test.log || {
            grep -E "Failed |Error Message|Assert|Exception|error" test.log | sort -u | head -80 | sed 's/^/::error::/'
            exit 1
          }

  # The author's machine has no .NET SDK, so CI creates EF Core migrations: whenever the model has
  # changes that no migration covers, a migration is generated and committed back to main.
  migration:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Generate and commit a migration if the model changed
        shell: bash
        run: |
          dotnet tool restore
          dotnet restore IntelligenceDB.slnx
          EF="--project src/IntelligenceDB.Infrastructure --startup-project src/IntelligenceDB.Api"
          if dotnet ef migrations has-pending-model-changes $EF; then
            echo "Model and migrations are in sync."
            exit 0
          fi
          NAME="Auto$(date -u +%Y%m%d%H%M)"
          if ! ls src/IntelligenceDB.Infrastructure/Repository/Migrations/*_InitialCreate.cs >/dev/null 2>&1; then NAME=InitialCreate; fi
          dotnet ef migrations add "$NAME" $EF --output-dir Repository/Migrations
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/IntelligenceDB.Infrastructure/Repository/Migrations
          git commit -m "Add repository migration $NAME (generated by CI)"
          git push
  # Starts the real API against a real SQL Server and runs scripts/e2e-smoke.sh.
  e2e:
    needs: backend
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: "Developer"
          MSSQL_SA_PASSWORD: "IntelliDb!Ci2026"
          MSSQL_AGENT_ENABLED: "true"
        ports:
          - 1433:1433
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Repository: "Server=localhost,1433;Database=IntelligenceDB_Repo;User Id=sa;Password=IntelliDb!Ci2026;Encrypt=True;TrustServerCertificate=True"
      Jwt__SigningKey: "ci-only-signing-key-0123456789-abcdefghijklmnopqrstuvwxyz"
      Bootstrap__AdminEmail: "admin@e2e.local"
      Bootstrap__AdminPassword: "Admin!E2e2026pass"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Ensure a migration exists (temporary for this run if not committed yet)
        shell: bash
        run: |
          dotnet tool restore
          dotnet restore IntelligenceDB.slnx
          EF="--project src/IntelligenceDB.Infrastructure --startup-project src/IntelligenceDB.Api"
          if ! dotnet ef migrations has-pending-model-changes $EF; then
            dotnet ef migrations add E2eTemp $EF --output-dir Repository/Migrations
          fi
      - name: Build
        run: dotnet build IntelligenceDB.slnx -c Release
      - name: Start API and Worker
        shell: bash
        run: |
          nohup dotnet run --project src/IntelligenceDB.Api -c Release --no-build --no-launch-profile \
            --urls http://localhost:5080 > api.log 2>&1 &
          sleep 20   # let the API apply migrations before the Worker starts polling
          nohup dotnet run --project src/IntelligenceDB.Worker -c Release --no-build > worker.log 2>&1 &
      - name: End-to-end smoke test
        shell: bash
        env:
          ADMIN_EMAIL: "admin@e2e.local"
          ADMIN_PASSWORD: "Admin!E2e2026pass"
          TARGET_HOST: "localhost"
          TARGET_PASSWORD: "IntelliDb!Ci2026"
        run: |
          bash scripts/e2e-smoke.sh || {
            for f in api worker agent; do
              [ -f $f.log ] && grep -E "fail|error|Exception| ERR | FTL " -i $f.log | grep -v "Microsoft.Hosting" | sort -u | head -25 | sed "s/^/::error::$f: /"
            done
            exit 1
          }
      - name: Logs
        if: always()
        run: |
          for f in api worker agent; do echo "===== $f ====="; tail -80 $f.log 2>/dev/null || true; done

  # Windows agent package for on-premises networks (download from the run's Artifacts).
  agent-package:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Publish self-contained agent for Windows x64
        run: |
          dotnet publish src/IntelligenceDB.Agent -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/agent
          cp scripts/agent/*.ps1 out/agent/
      - uses: actions/upload-artifact@v4
        with:
          name: intelligencedb-agent-win-x64
          path: out/agent
          retention-days: 30

  # Builds the Docker images and runs the production compose stack (Caddy -> API, Worker, SQL Server).
  docker:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        working-directory: deploy
        run: |
          cat > .env <<'EOF'
          DOMAIN=:80
          ADMIN_EMAIL=admin@docker.local
          ADMIN_PASSWORD=Admin!Docker2026
          SQL_SA_PASSWORD=Sql!Docker2026pass
          JWT_SIGNING_KEY=ci-docker-signing-key-0123456789-abcdefghijklmnop
          EOF
          docker compose up -d --build
      - name: Smoke test through Caddy
        shell: bash
        run: |
          set -e
          for i in $(seq 1 60); do curl -fs http://localhost/health >/dev/null && break; sleep 5; done
          curl -fs http://localhost/health
          curl -fs http://localhost/ | grep -q '<div id="root">'   # web app served by the API
          H=(-H "Content-Type: application/json" -H "X-Requested-With: IntelligenceDB")
          TOKEN=$(curl -fs "${H[@]}" -X POST http://localhost/api/auth/login -d '{"email":"admin@docker.local","password":"Admin!Docker2026"}' | jq -r '.session.accessToken')
          S=$(curl -fs "${H[@]}" -H "Authorization: Bearer $TOKEN" -X POST http://localhost/api/servers -d '{"displayName":"REPO-SQL","host":"sql","port":1433,"declaredPlatform":"OnPremises","trustServerCertificate":true,"monitoring":{"authType":"SqlLogin","userName":"sa","secret":"Sql!Docker2026pass"}}')
          echo "$S" | jq -e '.server.lastStatus == "Online"' >/dev/null || { echo "::error::server not online: $S"; exit 1; }
          ID=$(echo "$S" | jq -r '.server.id')
          for i in $(seq 1 30); do
            OV=$(curl -fs -H "Authorization: Bearer $TOKEN" http://localhost/api/servers/$ID/overview)
            echo "$OV" | jq -e '.health != null and .databases.total > 0' >/dev/null && { echo "Docker stack OK: health $(echo "$OV" | jq .health.score)"; exit 0; }
            sleep 5
          done
          echo "::error::worker did not collect inside Docker"; exit 1
      - name: Container logs
        if: always()
        working-directory: deploy
        run: docker compose logs --tail 60

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IntelligenceDB.Web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/IntelligenceDB.Web/package-lock.json
      - run: npm ci
      - run: npm run build
